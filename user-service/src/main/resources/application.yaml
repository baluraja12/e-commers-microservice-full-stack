server:
  port: 8083

spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:mysql://localhost:3306/userdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Balu@1998

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


management:
  tracing:
    sampling:
      probability: 1.0
  Zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
          exposure:
            include: health,info,metrics,prometheus
  endpoint:
    health:
          show-details: always
          prometheus:
          enabled: true
  metrics:
    export:
          prometheus:
            enabled: true
  zipkin:
    tracing:
          endpoint: http://localhost:9411/api/v2/spans

endpoints:
  web:
    exposure:
      include: health,info,metrics

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
