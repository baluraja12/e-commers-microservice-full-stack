<h2>My Orders</h2>

<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border text-primary"></div>
</div>

<div *ngIf="error" class="alert alert-danger">{{error}}</div>

<div *ngIf="!loading && orders.length === 0" class="alert alert-info">
  You have no orders yet. <a routerLink="/products">Start shopping</a>
</div>

<div class="row" *ngIf="orders.length > 0">
  <div class="col-md-6 mb-3" *ngFor="let order of orders">
    <div class="card shadow-sm">
      <div class="card-header d-flex justify-content-between">
        <span>Order #{{order.id}}</span>
        <span class="badge" [ngClass]="getStatusClass(order.status)">{{order.status}}</span>
      </div>
      <div class="card-body">
        <p class="mb-1"><strong>Total:</strong> ₹{{order.totalAmount}}</p>
        <p class="mb-1"><strong>Date:</strong> {{order.createdAt | date:'medium'}}</p>
        <hr>
        <h6>Items:</h6>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between" *ngFor="let item of order.orderItems">
            <span>{{item.productName}} x{{item.quantity}}</span>
            <span>₹{{item.subtotal}}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
