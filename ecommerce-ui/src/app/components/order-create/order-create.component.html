<h2>Checkout</h2>

<div class="row">
  <div class="col-md-8">
    <div class="card shadow mb-3">
      <div class="card-header">
        <h5 class="mb-0">Order Summary</h5>
      </div>
      <div class="card-body">
        <table class="table table-sm">
          <thead>
            <tr>
              <th>Product</th>
              <th>Qty</th>
              <th class="text-end">Price</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of cartItems">
              <td>{{item.product.name}}</td>
              <td>{{item.quantity}}</td>
              <td class="text-end">₹{{(item.product.price * item.quantity).toFixed(2)}}</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <th colspan="2">Total</th>
              <th class="text-end">₹{{total.toFixed(2)}}</th>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-header">
        <h5 class="mb-0">Confirm Order</h5>
      </div>
      <div class="card-body">
        <div *ngIf="error" class="alert alert-danger">{{error}}</div>
        <div *ngIf="success" class="alert alert-success">{{success}}</div>
        <p class="text-muted">Click below to place your order.</p>
        <button class="btn btn-success w-100" (click)="placeOrder()" [disabled]="loading || cartItems.length === 0">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          Place Order
        </button>
        <a class="btn btn-outline-secondary w-100 mt-2" routerLink="/cart">Back to Cart</a>
      </div>
    </div>
  </div>
</div>
