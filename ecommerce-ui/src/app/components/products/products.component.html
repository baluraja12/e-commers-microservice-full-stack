<div class="products-container">
  <h2>Our Products</h2>

  <div *ngIf="loading" class="loading">Loading products...</div>

  <div *ngIf="!loading && error" class="error">{{ error }}</div>

  <div *ngIf="!loading && !error && products.length === 0" class="empty">
    No products found.
  </div>

  <div class="products-grid" *ngIf="!loading && !error && products.length > 0">
    <div class="product-card" *ngFor="let product of products">
      <div class="product-image">
        <img
          [src]="product.imageUrl || 'https://via.placeholder.com/300x200?text=No+Image'"
          [alt]="product.name"
          (error)="product.imageUrl = 'https://via.placeholder.com/300x200?text=No+Image'"
        />
      </div>
      <div class="product-info">
        <h3>{{ product.name }}</h3>
        <p class="category">{{ product.category }}</p>
        <p class="price">${{ product.price }}</p>
        <div class="actions">
          <button (click)="viewDetails(product.id)">View Details</button>
          <button (click)="addToCart(product)" class="btn-cart">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>
</div>
