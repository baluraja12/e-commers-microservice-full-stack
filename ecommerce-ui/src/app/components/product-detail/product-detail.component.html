<div class="row justify-content-center" *ngIf="product">
  <div class="col-md-8">
    <div class="card shadow">
      <div class="card-body">
        <h2 class="card-title">{{product.name}}</h2>
        <p class="card-text text-muted">{{product.description || 'No description available.'}}</p>
        <h4 class="text-primary">₹{{product.price}}</h4>
        <p>
          <span class="badge" [ngClass]="product.stockQuantity > 0 ? 'bg-success' : 'bg-danger'">
            {{product.stockQuantity > 0 ? 'In Stock: ' + product.stockQuantity : 'Out of Stock'}}
          </span>
        </p>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" (click)="addToCart()" [disabled]="product.stockQuantity === 0">
            Add to Cart
          </button>
          <a class="btn btn-outline-secondary" routerLink="/products">Back to Products</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border text-primary"></div>
</div>

<div *ngIf="error" class="alert alert-danger">{{error}}</div>
