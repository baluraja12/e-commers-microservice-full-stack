<div *ngIf="loading" class="loading">Loading product details...</div>

<div *ngIf="!loading && error" class="error">{{ error }}</div>

<div *ngIf="!loading && !error && product" class="product-detail-container">
  <div class="product-image-section">
    <img
      [src]="product.imageUrl || 'https://via.placeholder.com/500x400?text=No+Image'"
      [alt]="product.name"
      (error)="product.imageUrl = 'https://via.placeholder.com/500x400?text=No+Image'"
    />
  </div>
  <div class="product-info-section">
    <h1>{{ product.name }}</h1>
    <p class="category">{{ product.category }}</p>
    <p class="price">${{ product.price }}</p>
    <p class="stock" [class.low-stock]="product.stockQuantity < 5">
      Stock: {{ product.stockQuantity }} available
    </p>
    <p class="description">{{ product.description }}</p>
    <div class="actions">
      <button (click)="addToCart()" class="btn-cart">Add to Cart</button>
      <button routerLink="/products" class="btn-back">Back to Products</button>
    </div>
  </div>
</div>

<div *ngIf="!loading && !error && !product" class="error">
  Product not found.
</div>
