<div class="cart-container">
  <h2>Your Shopping Cart</h2>
  <a routerLink="/products" class="continue-shopping">← Continue Shopping</a>

  <div *ngIf="cartItems.length === 0" class="empty-cart">
    <p>Your cart is empty.</p>
    <button routerLink="/products" class="btn-shop">Start Shopping</button>
  </div>

  <div *ngIf="cartItems.length > 0" class="cart-content">
    <div class="cart-items">
      <div class="cart-item" *ngFor="let item of cartItems">
        <img
          [src]="item.product.imageUrl || 'https://via.placeholder.com/80x80?text=No+Image'"
          [alt]="item.product.name"
          class="cart-item-image"
          (error)="item.product.imageUrl = 'https://via.placeholder.com/80x80?text=No+Image'"
        />
        <div class="cart-item-details">
          <h4>{{ item.product.name }}</h4>
          <p class="item-price">${{ item.product.price }}</p>
        </div>
        <div class="cart-item-quantity">
          <button (click)="decreaseQuantity(item)">-</button>
          <span>{{ item.quantity }}</span>
          <button (click)="increaseQuantity(item)">+</button>
        </div>
        <p class="item-total">${{ item.product.price * item.quantity | number: '1.2-2' }}</p>
        <button class="btn-remove" (click)="removeItem(item.product.id!)">✕</button>
      </div>
    </div>

    <div class="cart-summary">
      <h3>Order Summary</h3>
      <p class="total">Total: <strong>${{ total | number: '1.2-2' }}</strong></p>
      <button class="btn-checkout">Proceed to Checkout</button>
      <button class="btn-clear" (click)="clearCart()">Clear Cart</button>
    </div>
  </div>
</div>
