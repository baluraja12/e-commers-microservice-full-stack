server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:"   # <-- ADD THIS LINE
  cloud:
    config:
      uri: http://localhost:8888       # <-- ADD THIS LINE (points to your running Config Server)
    gateway:
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka